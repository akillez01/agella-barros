      gap: 1rem;
      padding-top: .8rem
    }

    .adm-actions button {
      font-size: .74rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--wine-900)
    }

    .adm-actions button:hover {
      color: var(--gold)
    }

    .adm-actions .danger {
      color: var(--ink-300)
    }

    .adm-actions .danger:hover {
      color: #a33
    }

    .adm-add {
      border: 1px dashed var(--ink-300);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: .7rem;
      align-items: center;
      justify-content: center;
      color: var(--ink-500);
      min-height: 220px;
      transition: all .25s
    }

    .adm-add:hover {
      border-color: var(--wine-900);
      color: var(--wine-900);
      background: var(--cream-50)
    }

    .adm-add span {
      font-size: .74rem;
      letter-spacing: .18em;
      text-transform: uppercase
    }

    .dropzone {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      padding: 1.6rem;
      border: 1px dashed var(--ink-300);
      border-radius: 8px;
      color: var(--ink-500);
      cursor: pointer;
      transition: all .25s;
      margin-bottom: 1.5rem
    }

    .dropzone:hover,
    .dropzone.over {
      border-color: var(--wine-900);
      background: var(--cream-50);
      color: var(--wine-900)
    }

    .dropzone strong {
      display: block;
      font-family: var(--serif);
      font-size: 1.15rem;
      font-weight: 400;
      color: var(--wine-900)
    }

    .dropzone span {
      font-size: .82rem
    }

    .gal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: .9rem
    }

    .gal-item {
      position: relative;
      aspect-ratio: 1/1;
      border-radius: 8px;
      overflow: hidden;
      background: var(--cream-200)
    }

    .gal-item img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .gal-overlay {
      position: absolute;
      inset: auto 0 0 0;
      padding: 2rem .7rem .7rem;
      background: linear-gradient(transparent, rgba(26, 20, 17, .85));
      display: flex;
      flex-direction: column;
      gap: .4rem
    }

    .gal-cap {
      background: rgba(255, 255, 255, .14);
      border: none;
      border-radius: 4px;
      color: #fff;
      font-family: var(--sans);
      font-size: .8rem;
      padding: .4rem .6rem;
      outline: none;
      width: 100%
    }

    .gal-cap:focus {
      background: rgba(255, 255, 255, .24)
    }

    .gal-cat {
      background: rgba(255, 255, 255, .14);
      border: none;
      border-radius: 4px;
      color: #fff;
      font-family: var(--sans);
      font-size: .72rem;
      padding: .35rem .5rem;
      outline: none
    }

    .gal-cat option {
      color: #1a1411
    }

    .gal-del {
      position: absolute;
      top: .5rem;
      right: .5rem;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: rgba(26, 20, 17, .6);
      color: #fff;
      display: grid;
      place-items: center;
      backdrop-filter: blur(4px);
      transition: all .2s
    }

    .gal-del:hover {
      background: #a33
    }

    .perfil-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem
    }

    @media (max-width:980px) {
      .perfil-grid {
        grid-template-columns: 1fr
      }
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: .4rem
    }

    .field-label {
      font-size: .66rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--ink-500)
    }

    .field input,
    .field textarea,
    .field select {
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: .75rem .9rem;
      font-family: var(--sans);
      font-size: .92rem;
      background: #fff;
      color: var(--ink-900);
      outline: none;
      resize: vertical;
      width: 100%
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--wine-900)
    }

    .img-picker {
      display: flex;
      gap: 1.1rem;
      align-items: start
    }

    .img-preview {
      width: 88px;
      aspect-ratio: 4/5;
      border-radius: 6px;
      overflow: hidden;
      background: var(--cream-100);
      flex-shrink: 0;
      border: 1px solid var(--rule)
    }

    .img-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .tone-row {
      display: flex;
      gap: .5rem;
      align-items: center;
      margin-top: .6rem
    }

    .tone {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 2px solid transparent;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1)
    }

    .tone.wine {
      background: #4A0E1C
    }

    .tone.amber {
      background: #B8935A
    }

    .tone.cream {
      background: #F2ECE5
    }

    .tone.rose {
      background: #e9d3cf
    }

    .tone.sel {
      border-color: var(--wine-900);
      transform: scale(1.1)
    }

    .seg {
      display: flex;
      gap: .2rem;
      background: var(--cream-50);
      border: 1px solid var(--rule);
      border-radius: 999px;
      padding: .25rem
    }

    .seg button {
      font-size: .72rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: .5rem .85rem;
      border-radius: 999px;
      color: var(--ink-500);
      transition: all .2s
    }

    .seg button.on {
      background: var(--wine-900);
      color: var(--cream-50)
    }

    .adm-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .9rem
    }

    .adm-table th {
      text-align: left;
      font-size: .64rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--ink-500);
      font-weight: 500;
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--rule);
      background: var(--cream-100)
    }

    .adm-table td {
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--rule);
      color: var(--ink-700)
    }

    .adm-table tr:last-child td {
      border-bottom: none
    }

    .adm-table strong {
      font-family: var(--serif);
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--wine-900)
    }

    .via {
      font-size: .66rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: .25rem .6rem;
      border-radius: 999px;
      background: var(--cream-200);
      color: var(--ink-700)
    }

    .via.ia {
      background: var(--wine-900);
      color: var(--gold-soft)
    }

    .status-sel {
      border: 1px solid var(--rule);
      border-radius: 999px;
      padding: .4rem .8rem;
      font-family: var(--sans);
      font-size: .78rem;
      background: #fff;
      outline: none;
      text-transform: capitalize
    }

    .status-sel.confirmado {
      border-color: var(--wine-900);
      color: var(--wine-900)
    }

    .status-sel.pendente {
      border-color: var(--gold);
      color: #7a5c25
    }

    .status-sel.cancelado {
      border-color: #d9a0a0;
      color: #a33
    }

    .modal-scrim {
      position: fixed;
      inset: 0;
      background: rgba(26, 20, 17, .55);
      z-index: 210;
      display: grid;
      place-items: center;
      padding: 2rem;
      backdrop-filter: blur(3px)
    }

    .modal {
      background: var(--cream-50);
      border-radius: 10px;
      width: min(640px, 100%);
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg)
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.4rem 1.6rem;
      border-bottom: 1px solid var(--rule)
    }

    .modal-head h3 {
      font-size: 1.5rem;
      font-weight: 400
    }

    .modal-body {
      padding: 1.6rem;
      overflow-y: auto
    }

    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: .7rem;
      padding: 1.2rem 1.6rem;
      border-top: 1px solid var(--rule);
      background: #fff;
      border-radius: 0 0 10px 10px
    }

    .admin-login {
      position: relative;
      background: var(--cream-50);
      border-radius: 10px;
      padding: 3rem;
      width: min(420px, 100%);
      text-align: center;
      box-shadow: var(--shadow-lg);
      margin: auto
    }

    .admin-root:has(.admin-login) {
      display: grid;
      place-items: center;
      padding: 2rem;
      background: rgba(26, 20, 17, .6);
      backdrop-filter: blur(6px)
    }

    .admin-login-x {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 38px;
      height: 38px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: var(--ink-500)
    }

    .admin-login-x:hover {
      background: var(--cream-100)
    }

    .admin-pin {
      width: 100%;
      text-align: center;
      font-size: 1.8rem;
      letter-spacing: .6em;
      padding: 1rem;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: #fff;
      outline: none;
      font-family: var(--sans);
      color: var(--wine-900)
    }

    .admin-pin:focus {
      border-color: var(--wine-900)
    }

    .admin-pin.err {
      border-color: #a33;
      animation: shake .35s
    }

    @keyframes shake {
      25% {
        transform: translateX(-6px)
      }

      75% {
        transform: translateX(6px)
      }
    }

    .admin-err {
      color: #a33;
      font-size: .82rem;
      margin-top: .7rem
    }

    .admin-hint {
      margin-top: 1.6rem;
      font-size: .78rem;
      color: var(--ink-300)
    }

    .admin-hint strong {
      color: var(--wine-900);
      font-weight: 500
    }

    .foot-admin {
      background: none;
      border: none;
      color: rgba(249, 245, 242, .45);
      font-size: .78rem;
      cursor: pointer;
      font-family: var(--sans)
    }

    .foot-admin:hover {
      color: var(--gold-soft)
    }

    /* ——— Instagram ——— */
    .ig {
      background: var(--cream-100)
    }

    .ig-profile {
      display: flex;
      gap: 2.4rem;
      align-items: center;
      padding-bottom: 2.8rem;
      margin-bottom: 2.8rem;
      border-bottom: 1px solid var(--rule)
    }

    @media (max-width:720px) {
      .ig-profile {
        flex-direction: column;
        gap: 1.4rem;
        text-align: center;
        align-items: center
      }
    }

    .ig-avatar-ring {
      width: 132px;
      height: 132px;
      border-radius: 999px;
      padding: 3px;
      flex-shrink: 0;
      background: conic-gradient(from 210deg, var(--gold), var(--wine-700), var(--wine-900), var(--gold))
    }

    .ig-avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      object-fit: cover;
      border: 4px solid var(--cream-100)
    }

    @media (max-width:720px) {
      .ig-avatar-ring {
        width: 104px;
        height: 104px
      }
    }

    .ig-profile-main {
      flex: 1;
      min-width: 0
    }

    .ig-handle-row {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      flex-wrap: wrap
    }

    @media (max-width:720px) {
      .ig-handle-row {
        justify-content: center
      }
    }

    .ig-handle {
      font-family: var(--serif);
      font-size: 2rem;
      color: var(--wine-900);
      line-height: 1;
      font-weight: 400
    }

    .ig-handle:hover {
      color: var(--gold)
    }

    .ig-follow {
      padding: .7rem 1.3rem;
      font-size: .72rem
    }

    .ig-stats {
      display: flex;
      gap: 2.2rem;
      margin: 1.3rem 0 1rem;
      font-size: .92rem;
      color: var(--ink-500);
      flex-wrap: wrap
    }

    @media (max-width:720px) {
      .ig-stats {
        justify-content: center;
        gap: 1.4rem
      }
    }

    .ig-stats strong {
      font-family: var(--serif);
      font-size: 1.25rem;
      color: var(--wine-900);
      font-weight: 400;
      margin-right: .25rem
    }

    .ig-bio {
      font-size: .95rem;
      color: var(--ink-700);
      white-space: pre-line;
      max-width: 52ch;
      line-height: 1.6
    }

    @media (max-width:720px) {
      .ig-bio {
        margin: 0 auto
      }
    }

    .ig-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .75rem
    }

    @media (max-width:720px) {
      .ig-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: .5rem
      }
    }

    .ig-post {
      position: relative;
      aspect-ratio: 1/1;
      border-radius: 4px;
      overflow: hidden;
      background: var(--cream-200);
      display: block;
      width: 100%;
      padding: 0
    }

    .ig-post img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .7s cubic-bezier(.2, .7, .2, 1)
    }

    .ig-post:hover img {
      transform: scale(1.05)
    }

    .ig-type {
      position: absolute;
      top: .7rem;
      right: .7rem;
      color: #fff;
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .5));
      display: grid;
      place-items: center;
      z-index: 2
    }

    .ig-hover {
      position: absolute;
      inset: 0;
      background: rgba(74, 14, 28, .62);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.6rem;
      color: #fff;
      font-size: .92rem;
      opacity: 0;
      transition: opacity .3s;
      backdrop-filter: blur(1px)
    }

    .ig-post:hover .ig-hover {
      opacity: 1
    }

    .ig-hover span {
      display: flex;
      align-items: center;
      gap: .45rem;
      font-weight: 500
    }

    .ig-foot {
      display: flex;
      justify-content: center;
      margin-top: 2.6rem
    }

    .ig-lightbox {
      cursor: default;
      padding: 2rem
    }

    .ig-modal {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      background: var(--cream-50);
      border-radius: 8px;
      overflow: hidden;
      max-width: min(940px, 100%);
      max-height: 86vh;
      width: 100%;
      box-shadow: var(--shadow-lg)
    }

    @media (max-width:760px) {
      .ig-modal {
        grid-template-columns: 1fr;
        max-height: 90vh;
        overflow-y: auto
      }
    }

    .ig-modal-img {
      background: var(--ink-900);
      display: grid;
      place-items: center;
      overflow: hidden
    }

    .ig-modal-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      max-height: 86vh
    }

    .ig-modal-side {
      display: flex;
      flex-direction: column;
      min-width: 0
    }

    .ig-modal-head {
      display: flex;
      align-items: center;
      gap: .8rem;
      padding: 1.1rem 1.2rem;
      border-bottom: 1px solid var(--rule)
    }

    .ig-modal-head img {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      object-fit: cover
    }

    .ig-modal-handle {
      font-size: .92rem;
      font-weight: 500;
      color: var(--wine-900)
    }

    .ig-modal-loc {
      font-size: .76rem;
      color: var(--ink-500);
      margin-top: .15rem
    }

    .ig-modal-head .drawer-close {
      margin-left: auto;
      width: 34px;
      height: 34px
    }

    .ig-modal-body {
      padding: 1.3rem 1.2rem;
      flex: 1;
      overflow-y: auto
    }

    .ig-modal-body p {
      font-size: .94rem;
      color: var(--ink-700);
      line-height: 1.65
    }

    .ig-modal-body strong {
      color: var(--wine-900);
      font-weight: 500;
      margin-right: .3rem
    }

    .ig-modal-tags {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      margin-top: 1rem
    }

    .ig-modal-tags span {
      font-size: .82rem;
      color: var(--gold)
    }

    .ig-modal-foot {
      padding: 1.2rem;
      border-top: 1px solid var(--rule);
      background: #fff
    }

    .ig-modal-acts {
      display: flex;
      gap: 1rem;
      color: var(--wine-900);
      margin-bottom: .6rem
    }

    .ig-modal-likes {
      font-size: .86rem;
      color: var(--ink-500)
    }

    .ig-conn {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.1rem 1.2rem;
      background: var(--cream-100);
      border-radius: 8px
    }

    .ig-conn-badge {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      background: var(--wine-900);
      color: var(--gold-soft);
      display: grid;
      place-items: center;
      flex-shrink: 0
    }

    .ig-conn strong {
      font-family: var(--serif);
      font-size: 1.15rem;
      font-weight: 400;
      color: var(--wine-900);
      display: block
    }

    .ig-conn p {
      font-size: .85rem;
      color: var(--ink-500);
      margin-top: .2rem
    }

    /* ——— Checkout ——— */
    .ck {
      background: var(--cream-50);
      border-radius: 10px;
      width: min(680px, 100%);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg)
    }

    .ck-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 1rem;
      padding: 1.5rem 1.7rem 1.2rem;
      border-bottom: 1px solid var(--rule)
    }

    .ck-head h3 {
      font-size: 1.7rem;
      font-weight: 400;
      line-height: 1
    }

    .ck-body {
      padding: 1.5rem 1.7rem;
      overflow-y: auto;
      flex: 1
    }

    .ck-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.1rem 1.7rem;
      border-top: 1px solid var(--rule);
      background: #fff;
      border-radius: 0 0 10px 10px
    }

    .ck-total {
      font-family: var(--serif);
      font-size: 1.5rem;
      color: var(--wine-900)
    }

    .ck-label {
      font-size: .66rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--ink-500);
      margin: 1.4rem 0 .7rem
    }

    .ck-opts {
      display: grid;
      gap: .6rem
    }

    .ck-opt {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .2rem 1rem;
      padding: 1rem 1.2rem;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: #fff;
      text-align: left;
      transition: all .25s
    }

    .ck-opt:hover {
      border-color: var(--gold)
    }

    .ck-opt.on {
      border-color: var(--wine-900);
      box-shadow: inset 0 0 0 1px var(--wine-900)
    }

    .ck-opt strong {
      font-family: var(--serif);
      font-size: 1.2rem;
      font-weight: 400;
      color: var(--wine-900)
    }

    .ck-opt span {
      grid-column: 1;
      font-size: .84rem;
      color: var(--ink-500)
    }

    .ck-opt em {
      grid-row: 1/3;
      grid-column: 2;
      align-self: center;
      font-style: normal;
      font-family: var(--serif);
      font-size: 1.1rem;
      color: var(--gold)
    }

    .ck-sum {
      margin-top: 1.5rem;
      padding: 1.1rem 1.3rem;
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: 8px
    }

    .ck-sum .receipt-row {
      border-color: var(--rule)
    }

    .ck-sum .receipt-row+.receipt-row {
      border-top: 1px dashed var(--rule)
    }

    .ck-note {
      margin-top: 1rem;
      padding: .9rem 1.1rem;
      background: rgba(184, 147, 90, .12);
      border-radius: 6px;
      font-size: .85rem;
      color: #7a5c25;
      line-height: 1.5
    }

    .ck-done {
      text-align: center;
      padding: 1.5rem 0 .5rem;
      display: flex;
      flex-direction: column;
      align-items: center
    }

    .pix-pane {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1.6rem;
      align-items: start
    }

    @media (max-width:620px) {
      .pix-pane {
        grid-template-columns: 1fr
      }
    }

    .pix-qr {
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: .8rem;
      display: grid;
      place-items: center
    }

    .pix-val {
      font-family: var(--serif);
      font-size: 2rem;
      color: var(--wine-900);
      line-height: 1
    }

    .pix-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .7rem;
      line-height: 1.5;
      color: var(--ink-700);
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: .8rem;
      max-height: 96px;
      overflow-y: auto;
      word-break: break-all
    }

    .adm-orders .receipt-row {
      border: none
    }

    .order-items {
      font-size: .82rem;
      color: var(--ink-500)
    }

    .pay-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      align-items: start
    }

    @media (max-width:980px) {
      .pay-grid {
        grid-template-columns: 1fr
      }
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .8rem 0;
      border-top: 1px solid var(--rule)
    }

    .toggle-row span {
      font-size: .9rem;
      color: var(--ink-700)
    }

    .switch {
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background: var(--cream-200);
      position: relative;
      transition: background .25s;
      flex-shrink: 0
    }

    .switch.on {
      background: var(--wine-900)
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #fff;
      transition: transform .25s
    }

    .switch.on::after {
      transform: translateX(20px)
    }

    .admin-login .field input {
      text-align: left
    }

    /* ——— Loader ——— */
    body.is-loading {
      overflow: hidden
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: #160a0e;
      display: grid;
      place-items: center;
      transition: opacity .9s ease, visibility .9s
    }

    #loader.is-done {
      opacity: 0;
      visibility: hidden
    }

    .li-wrap {
      display: grid;
      place-items: center;
      gap: 1.4rem;
      text-align: center;
      color: var(--cream-50)
    }

    .li-ring-box {
      position: relative;
      width: 120px;
      height: 120px
    }

    .li-ring-box svg {
      transform: rotate(-90deg)
    }

    .li-ring-bg {
      stroke: rgba(249, 245, 242, .14)
    }

    .li-ring {
      stroke: var(--gold);
      stroke-dasharray: 326.7;
      stroke-dashoffset: 326.7;
      transition: stroke-dashoffset .4s ease
    }

    .li-pct {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: var(--serif);
      font-size: 1.6rem;
      color: var(--cream-50)
    }

    .li-name {
      font-family: var(--serif);
      font-size: 1.5rem;
      letter-spacing: .06em
    }

    .li-sub {
      font-size: .66rem;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: rgba(249, 245, 242, .45)
    }

    /* ——— Cursor ——— */
    .cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 14px;
      height: 14px;
      margin: -7px 0 0 -7px;
      border-radius: 999px;
      background: var(--gold);
      z-index: 250;
      pointer-events: none;
      opacity: 0;
      mix-blend-mode: difference;
      transition: width .3s, height .3s, margin .3s, background .3s
    }

    .cursor.is-link {
      width: 26px;
      height: 26px;
      margin: -13px 0 0 -13px;
      background: var(--cream-50)
    }

    .cursor.is-view {
      width: 76px;
      height: 76px;
      margin: -38px 0 0 -38px;
      background: rgba(249, 245, 242, .9)
    }

    @media (hover:none) {
      .cursor {
        display: none
      }
    }

    /* ——— Abertura cinematográfica ——— */
    .cine {
      height: var(--cine-h, 300vh);
      position: relative;
      background: #160a0e
    }

    .cine-stage {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden
    }

    #film {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block
    }

    .cine-veil {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 45%, rgba(22, 10, 14, .28), rgba(22, 10, 14, .86) 100%), linear-gradient(180deg, rgba(22, 10, 14, .6), rgba(22, 10, 14, .15) 34%, rgba(22, 10, 14, .7))
    }

    .cine-copy {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center start;
      padding: 0 clamp(1rem, 6vw, 4.5rem);
      text-align: left
    }

    .cine-copy>* {
      grid-area: 1/1;
      max-width: min(560px, 64vw)
    }

    .ho-intro h1 {
      color: var(--cream-50);
      font-size: clamp(2.8rem, 7vw, 6.4rem);
      line-height: .98;
      font-weight: 300;
      margin: 1.6rem 0 2.2rem;
      text-wrap: balance
    }

    .ho-intro>* {
      animation: cine-in 1.25s cubic-bezier(.2, .7, .2, 1) both
    }

    .ho-intro>*:nth-child(1) {
      animation-delay: .35s
    }

    .ho-intro>*:nth-child(2) {
      animation-delay: .5s
    }

    .ho-intro>*:nth-child(3) {
      animation-delay: .68s
    }

    @keyframes cine-in {
      from {
        opacity: 0;
        transform: translateY(58px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    #film {
      animation: cine-fade 1.8s ease both
    }

    @keyframes cine-fade {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @media (prefers-reduced-motion:reduce) {

      .ho-intro>*,
      #film {
        animation: none
      }
    }

    .cine-kicker {
      color: var(--gold-soft);
      justify-content: flex-start
    }

    .cine-kicker::before,
    .cine-kicker::after {
      background: var(--gold-soft)
    }

    .ho-intro .hero-ctas {
      justify-content: flex-start
    }

    @media (min-width:900px) {
      .cine-copy {
        padding: 0 clamp(1.5rem, 7vw, 7rem)
      }

      .cine-copy>* {
        max-width: min(620px, 48vw)
      }
    }

    @media (max-width:900px) {
      .ho-intro h1 {
        font-size: clamp(2.2rem, 6.2vw, 4.6rem);
        line-height: 1.02
      }
    }

    .btn-outline {
      background: transparent;
      color: var(--cream-50);
      border: 1px solid rgba(249, 245, 242, .45)
    }

    .btn-outline:hover {
      background: var(--cream-50);
      color: var(--wine-900)
    }

    .ho-beat {
      opacity: 0
    }

    .ho-beat h2 {
      color: var(--cream-50);
      font-size: clamp(2rem, 5.2vw, 4.4rem);
      line-height: 1.06;
      font-weight: 300;
      font-style: italic;
      text-wrap: balance
    }

    .hero-hud {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0 clamp(1.25rem, 4vw, 3rem);
      color: rgba(249, 245, 242, .7);
      font-size: .72rem;
      letter-spacing: .24em;
      text-transform: uppercase;
      animation: cine-fade 1.2s ease 1s both
    }

    .hud-k {
      color: rgba(249, 245, 242, .4);
      margin-right: .4rem
    }

    .hud-scroll {
      display: flex;
      align-items: center;
      gap: .7rem;
      color: rgba(249, 245, 242, .55)
    }

    .hud-scroll i {
      display: block;
      width: 46px;
      height: 1px;
      background: linear-gradient(90deg, var(--gold), transparent);
      animation: hud-slide 2.4s infinite
    }

    @keyframes hud-slide {
      0% {
        transform: translateX(-8px);
        opacity: .3
      }

      50% {
        opacity: 1
      }

      100% {
        transform: translateX(10px);
        opacity: .3
      }
    }

    @media (max-width:640px) {
      .hud-scroll {
        display: none
      }
    }

    .nav.over-hero:not(.scrolled) {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none
    }

    .nav.over-hero:not(.scrolled) .brand,
    .nav.over-hero:not(.scrolled) .nav-links a,
    .nav.over-hero:not(.scrolled) .cart-btn,
    .nav.over-hero:not(.scrolled) .menu-toggle {
      color: var(--cream-50)
    }

    .nav.over-hero:not(.scrolled) .brand-text small {
      color: rgba(249, 245, 242, .55)
    }

    .nav.over-hero:not(.scrolled) .nav-links a::after {
      background: var(--cream-50)
    }

    .nav.over-hero:not(.scrolled) .cart-btn:hover {
      background: rgba(255, 255, 255, .12)
    }

    /* ——— Galeria horizontal fixada ——— */
    .gal-h {
      background: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.8rem;
      overflow: hidden;
      padding: 5rem 0
    }

    .gal-h-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 2rem;
      flex-wrap: wrap;
      padding: 0 clamp(1.25rem, 6vw, 5rem)
    }

    .gal-h-head h2 {
      font-size: clamp(2.2rem, 4.4vw, 3.6rem);
      font-weight: 300;
      line-height: 1;
      margin-top: .9rem
    }

    .gal-h .gal-filters {
      margin: 0;
      justify-content: flex-end
    }

    .h-track {
      display: flex;
      gap: 1.4rem;
      padding: 0 clamp(1.25rem, 6vw, 5rem);
      will-change: transform
    }

    .h-track.is-native {
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 1rem
    }

    .h-track.is-native .h-panel {
      scroll-snap-align: center
    }

    .h-panel {
      flex: 0 0 clamp(230px, 26vw, 380px);
      display: flex;
      flex-direction: column;
      gap: .9rem
    }

    .h-media {
      aspect-ratio: 3/4;
      border-radius: 6px;
      overflow: hidden;
      background: var(--cream-100);
      cursor: zoom-in
    }

    .h-media img {
      width: 100%;
      height: 114%;
      object-fit: cover;
      transition: transform 1s cubic-bezier(.2, .7, .2, 1)
    }

    .h-panel:hover .h-media img {
      transform: scale(1.05)
    }

    .h-cap {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      font-size: .86rem;
      color: var(--ink-700)
    }

    .h-cap em {
      font-style: normal;
      font-size: .66rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--gold)
    }

    .h-num {
      font-family: var(--serif);
      color: var(--ink-300);
      font-size: .9rem
    }
  </style>
</head>
